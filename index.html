<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 语音助手 (DeepSeek)</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #14387d 0%, #006e8d 50%, #1640bf 100%);
            --sidebar-bg: rgba(10, 41, 78, 0.6);
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            user-select: none;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .sidebar-spacer {
            flex-grow: 1;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
        }

        .header-title {
            position: absolute;
            top: 24px;
            left: 32px;
            font-size: 18px;
            font-weight: 500;
            opacity: 0.9;
            pointer-events: none;
            user-select: none;
        }

        /* 返回按钮 */
        .back-btn-wrapper {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 20;
            animation: fade-in 0.25s ease;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateX(-3px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-btn:active {
            transform: translateX(0) scale(0.97);
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Center Avatar & Greeting */
        .center-content {
            text-align: center;
            margin-bottom: 80px;
        }

        .avatar-wrapper {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            border-radius: 0;
            overflow: visible;
            background: transparent;
            box-shadow: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .avatar-gif {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.35);
        }

        .glow-effect {
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            animation: glow-pulse 2s ease-in-out infinite;
            filter: blur(2px);
            pointer-events: none;
        }

        @keyframes glow-pulse {
            0% {
                transform: translateX(-50%) scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: translateX(-50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) scale(0.8);
                opacity: 0.5;
            }
        }

        .ripple {
            display: none;
        }

        .greeting {
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .sub-greeting {
            font-size: 18px;
            font-weight: 300;
            margin-bottom: 8px;
        }

        .desc {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .btn-primary {
            background: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-voice.active {
            background: #ef4444;
            border-color: #ef4444;
            animation: pulse-btn 1s infinite;
        }

        @keyframes pulse-btn {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* Chat Area */
        #chat-area {
            display: none;
            width: 100%;
            max-width: 820px;
            height: 60vh;
            overflow-y: auto;
            padding: 20px 16px;
            margin-bottom: 20px;
            scroll-behavior: smooth;
        }

        #chat-area::-webkit-scrollbar {
            width: 6px;
        }
        #chat-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        #chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 消息布局 */
        .message {
            margin-bottom: 22px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            animation: message-in 0.3s ease;
        }

        @keyframes message-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        /* 消息内容容器 */
        .message-content {
            display: flex;
            flex-direction: column;
            max-width: 72%;
        }

        .message.user .message-content {
            align-items: flex-end;
        }

        .message.ai .message-content {
            align-items: flex-start;
        }

        /* 聊天头像 */
        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35), 0 0 8px rgba(59, 130, 246, 0.25);
            margin-top: 3px;
            user-select: none;
            pointer-events: none;
        }

        /* 气泡样式 */
        .bubble {
            max-width: 100%;
            padding: 12px 18px;
            border-radius: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            line-height: 1.6;
            font-size: 15px;
            word-break: break-word;
            transition: all 0.3s ease;
        }

        .message.user .bubble {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 0 4px 18px rgba(59, 130, 246, 0.35);
            border-bottom-right-radius: 6px;
        }

        .message.ai .bubble {
            background: rgba(255, 255, 255, 0.06);
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        /* 时间戳 */
        .timestamp {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 5px;
            padding: 0 6px;
            user-select: none;
            letter-spacing: 0.5px;
        }

        /* 打字动画 */
        .typing-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%,
            20% {
                content: '';
            }
            40% {
                content: '.';
            }
            60% {
                content: '..';
            }
            80%,
            100% {
                content: '...';
            }
        }

        /* Input Bar */
        .input-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 10px 16px 10px 24px;
            border: 1px solid var(--glass-border);
            gap: 12px;
        }

        #user-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Settings Modal */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }
        .modal-content label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.8;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            margin-bottom: 20px;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent-blue);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-content button:hover {
            background: #2b6fe0;
        }

        /* Media Queries */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                position: fixed;
                height: 100%;
                z-index: 100;
                width: 240px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .header-title {
                display: none;
            }
            .input-bar {
                width: 95%;
                padding: 8px 12px 8px 20px;
                bottom: 15px;
            }
            .greeting {
                font-size: 24px;
            }
            .avatar-wrapper {
                width: 120px;
                height: 120px;
            }
            .glow-effect {
                width: 120px;
                height: 120px;
            }
            .chat-avatar {
                width: 34px;
                height: 34px;
            }
            .message-content {
                max-width: 78%;
            }
            .bubble {
                font-size: 14px;
                padding: 10px 14px;
            }
            .back-btn-wrapper {
                top: 12px;
            }
            .back-btn {
                padding: 6px 14px;
                font-size: 13px;
            }
            #chat-area {
                height: 55vh;
                padding: 15px 10px;
            }
        }

        .listening-text {
            display: none;
            font-size: 12px;
            margin-top: 10px;
            opacity: 0.8;
        }
        .btn-voice.active .listening-text {
            display: block;
        }
        .btn-voice.active .voice-label {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="logo">AI 助手</div>
        <div class="subtitle">您的智能语音伴侣</div>

        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            对话历史
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            快捷操作
        </div>
        <div class="nav-item" onclick="openSettings()">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            设置
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            个人中心
        </div>

        <div class="sidebar-spacer"></div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header-title">AI Assistant</div>

        <!-- 返回按钮 -->
        <div class="back-btn-wrapper" id="back-btn-wrapper">
            <button class="back-btn" onclick="goBack()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                返回首页
            </button>
        </div>

        <!-- Chat Area -->
        <div id="chat-area"></div>

        <!-- Center Greeting -->
        <div class="center-content" id="center-greeting">
            <div class="avatar-wrapper">
                <img class="avatar-gif" src="https://duk.tw/xeWAcE.gif" alt="AI 助手">
                <div class="glow-effect"></div>
            </div>
            <div class="greeting">你好！</div>
            <div class="sub-greeting">我是你的 AI 语音助手</div>
            <div class="desc">随时准备帮你处理问题、任务和对话</div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="focusInput()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    开始对话
                </button>
                <button class="btn btn-voice" id="voice-btn" onclick="toggleVoice()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <span class="voice-label">语音输入</span>
                    <span class="listening-text">正在录音...</span>
                </button>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="input-bar">
            <input type="text" id="user-input" placeholder="输入你的消息..." onkeypress="handleKeyPress(event)">
            <button class="icon-btn" onclick="sendMessage()" title="发送">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3>⚙️ API 设置</h3>
            <label for="api-key">输入你的 DeepSeek API Key</label>
            <input type="password" id="api-key" placeholder="sk-xxxxxxxxxxxxxxxx">
            <button onclick="saveSettings()">保存并连接</button>
            <p style="font-size: 12px; margin-top: 15px; opacity: 0.6; text-align: center;">Key 仅保存在本地浏览器内存中。</p>
        </div>
    </div>

    <script>
        const DEEPSEEK_API_URL = "https://api.deepseek.com/chat/completions";
        const SYSTEM_PROMPT = "你是一个友好、自然的语音助手。请用口语化、简洁、准确的中文回答，不要使用Markdown格式，不要出现星号、井号等特殊符号。语气亲切自然，像朋友聊天一样。";
        const AVATAR_URL = "https://duk.tw/xeWAcE.gif";

        let apiKey = localStorage.getItem('deepseek_api_key') || '';
        let isListening = false;
        let recognition = null;
        let isProcessing = false;
        let chatHistory = [];
        let selectedVoice = null;

        // 工具函数：获取当前时间 HH:MM
        function getCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return hours + ':' + minutes;
        }

        // 工具函数：HTML 转义，防止注入
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // 初始化语音识别
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const last = event.results.length - 1;
                const transcript = event.results[last][0].transcript;
                document.getElementById('user-input').value = transcript;
                stopListening();
                sendMessage();
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error', event.error);
                stopListening();
            };

            recognition.onend = function() {
                stopListening();
            };
        } else {
            alert("您的浏览器不支持语音输入，请使用 Chrome 或 Edge 浏览器。");
        }

        // 初始化语音合成，选择中文女声
        function initVoice() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                const preferredNames = ['Xiaoxiao', 'Yaoyao', 'Huihui', 'Google 普通话（中国大陆）', 'Microsoft Xiaoxiao', 'Microsoft Yaoyao'];
                for (let name of preferredNames) {
                    const found = voices.find(function(v) {
                        return v.name.includes(name) && v.lang.startsWith('zh');
                    });
                    if (found) {
                        selectedVoice = found;
                        break;
                    }
                }
                if (!selectedVoice) {
                    selectedVoice = voices.find(function(v) {
                        return v.lang.startsWith('zh') && /female|女|xiaoxiao|yaoyao|huihui/i.test(v.name);
                    }) || voices.find(function(v) {
                        return v.lang.startsWith('zh');
                    });
                }
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initVoice;
            initVoice();
        }

        // 语音播报函数
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
            utterance.pitch = 1.15;
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        // 停止语音播报
        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        // 返回首页
        function goBack() {
            // 停止语音播报
            stopSpeaking();
            // 清空聊天区域
            const chatArea = document.getElementById('chat-area');
            chatArea.innerHTML = '';
            chatArea.style.display = 'none';
            // 显示初始界面
            document.getElementById('center-greeting').style.display = 'block';
            // 隐藏返回按钮
            document.getElementById('back-btn-wrapper').style.display = 'none';
            // 重置聊天历史和处理状态
            chatHistory = [];
            isProcessing = false;
            // 清空输入框
            document.getElementById('user-input').value = '';
            // 停止语音识别（如果在录音）
            if (isListening) {
                stopListening();
            }
        }

        // 打开设置
        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
            if (apiKey) document.getElementById('api-key').value = apiKey;
        }

        // 保存设置
        function saveSettings() {
            const key = document.getElementById('api-key').value.trim();
            if (!key) {
                alert("请输入有效的 API Key");
                return;
            }
            apiKey = key;
            localStorage.setItem('deepseek_api_key', key);
            document.getElementById('settings-modal').style.display = 'none';
            document.getElementById('user-input').placeholder = "已连接 DeepSeek，输入问题吧...";
        }

        // 聚焦输入框
        function focusInput() {
            document.getElementById('user-input').focus();
        }

        // 按下回车发送
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // 切换语音输入
        function toggleVoice() {
            if (!recognition) return alert("您的浏览器不支持语音识别。");
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            if (!apiKey) {
                alert("请先点击左侧【设置】输入 DeepSeek API Key！");
                return;
            }
            isListening = true;
            document.getElementById('voice-btn').classList.add('active');
            recognition.start();
        }

        function stopListening() {
            isListening = false;
            document.getElementById('voice-btn').classList.remove('active');
            try {
                recognition.stop();
            } catch (e) {}
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert("请先点击左侧【设置】输入 DeepSeek API Key！");
                return;
            }
            if (isProcessing) return;

            input.value = '';
            isProcessing = true;

            // 切换到聊天界面
            document.getElementById('center-greeting').style.display = 'none';
            document.getElementById('chat-area').style.display = 'block';
            document.getElementById('back-btn-wrapper').style.display = 'block';

            appendMessage('user', text);
            chatHistory.push({
                role: "user",
                content: text
            });

            const loadingDiv = appendMessage('ai', '<span class="typing-dots">正在思考</span>', true);

            try {
                const messages = [
                    { role: "system", content: SYSTEM_PROMPT },
                    ...chatHistory
                ];

                const response = await fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: messages,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error('API 请求失败: ' + response.status);
                }

                const data = await response.json();
                let aiReply = data.choices[0].message.content;

                // 去除所有星号，避免页面上出现 *
                aiReply = aiReply.replace(/\*/g, '').trim();

                // 更新气泡内容（保留头像和时间戳）
                const bubbleEl = loadingDiv.querySelector('.bubble');
                if (bubbleEl) {
                    bubbleEl.innerHTML = escapeHtml(aiReply).replace(/\n/g, '<br>');
                }

                chatHistory.push({
                    role: "assistant",
                    content: aiReply
                });

                // 自动语音播报
                speakText(aiReply);

                const chatArea = document.getElementById('chat-area');
                chatArea.scrollTop = chatArea.scrollHeight;

            } catch (error) {
                const bubbleEl = loadingDiv.querySelector('.bubble');
                if (bubbleEl) {
                    bubbleEl.innerHTML = '<span style="color:#fca5a5;">错误: ' + escapeHtml(error.message) + '</span>';
                    bubbleEl.style.borderColor = '#ef4444';
                }
            } finally {
                isProcessing = false;
            }
        }

        // 添加消息到聊天区域
        function appendMessage(role, content, isLoading = false) {
            const chatArea = document.getElementById('chat-area');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + role;

            const currentTime = getCurrentTime();

            if (role === 'ai') {
                // AI 消息：GIF 头像 + 气泡 + 时间戳
                msgDiv.innerHTML =
                    '<img class="chat-avatar" src="' + AVATAR_URL + '" alt="AI 头像">' +
                    '<div class="message-content">' +
                    '    <div class="bubble">' + content + '</div>' +
                    '    <div class="timestamp">' + currentTime + '</div>' +
                    '</div>';
            } else {
                // 用户消息：气泡 + 时间戳
                msgDiv.innerHTML =
                    '<div class="message-content">' +
                    '    <div class="bubble">' + escapeHtml(content) + '</div>' +
                    '    <div class="timestamp">' + currentTime + '</div>' +
                    '</div>';
            }

            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return msgDiv;
        }

        // 初始化：如果已有 API Key，更新输入框提示
        if (apiKey) {
            document.getElementById('user-input').placeholder = "已连接 DeepSeek，输入问题吧...";
        }

        // 关闭设置弹窗（点击空白区域）
        document.getElementById('settings-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        });
    </script>
</body>
</html>
